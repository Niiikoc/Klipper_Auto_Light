# ===== Klipper Auto Light - example configuration =====
# Copy what you need into printer.cfg. Full docs: README.md
#
# ----- 1. Simple: case light by time of day -----
#
# [auto_light]
# lights: caselight                 # name of your [output_pin caselight]
# schedule_1: 07:00-19:00=1.0 Day   # HH:MM-HH:MM=value [optional name]
# schedule_2: 19:00-23:00=0.3 Evening
# schedule_3: 23:00-07:00=0.0 Night # schedules can cross midnight
# #fade_time: 1.0                   # seconds to fade between values
#
# ----- 2. Print-aware: light only while printing -----
#
# [auto_light]
# lights: caselight
# default: off                      # idle
# printing: 1.0
# complete: 1.0                     # keep on after the print...
# finish_hold: 600                  # ...for 10 minutes...
# fade_time: 20                     # ...then fade out slowly
#
# ----- 3. Several groups and colours (e.g. Stealthburner) -----
#
# [auto_light case]
# lights: caselight, bed_strip      # several lights, same value
# schedule_1: 08:00-22:00=0.8
# schedule_2: 22:00-08:00=warm@0.1
# printing: 1.0
#
# [auto_light logo]
# lights: sb_leds:1                 # only LED 1 of [neopixel sb_leds]
# default: purple@0.3
# printing: blue
# paused: orange                    # defaults to 'printing' if not set
# complete: green
# error: red
# cancelled: off
# finish_hold: 900
#
# [auto_light nozzle]
# lights: sb_leds:2-3               # LEDs 2 to 3
# default: off
# printing: FFFFFFFF                # RRGGBBWW (RGBW strip) - no '#'!
#
# ----- 4. Animations with klipper-led_effect -----
#
# [auto_light sb]
# lights: sb_leds                   # for the plain colours
# default: warm@0.2
# printing: effect:sb_printing      # [led_effect sb_printing]
# complete: effect:sb_rainbow
# error: effect:sb_error
# finish_hold: 120
#
# [auto_light party]                # effects only: no 'lights' needed
# schedule_1: 18:00-23:00=effect:rainbow Evening
# schedule_2: 23:00-18:00=off       # 'off' stops the effect
#
# ----- Values -----
# 0.6            brightness (0.0-1.0) of `color:` (white by default)
# warm           off, white, warm, red, green, blue, yellow, orange,
#                purple, magenta, cyan
# FF8800         hex RRGGBB (RRGGBBWW for RGBW)
# green@0.5      any colour at a brightness
# effect:name    run [led_effect name] (klipper-led_effect)
#
# ----- Other options -----
# color: white          base colour for plain brightness values
# enabled: True         default on first startup only (state is saved)
# check_interval: 600   safety re-check in seconds
# state_file: ~/printer_data/config/auto_light_state.json
#
# ===== G-CODE COMMANDS (LIGHT= is optional) =====
#
# SET_AUTO_LIGHT [LIGHT=name]                 - re-apply automatic value now
# AUTO_LIGHT_ENABLE / AUTO_LIGHT_DISABLE      - toggle automation (saved)
# AUTO_LIGHT_SET VALUE=warm@0.5 [LIGHT=name]  - try a value until next change
# AUTO_LIGHT_MENU [LIGHT=name]                - control panel (Mainsail)
# AUTO_LIGHT_LIST_SCHEDULES [LIGHT=name]      - show status
#
# UI buttons: add [include auto_light_macros.cfg] to printer.cfg
# AUTO_LIGHT_SCHEDULE_ENABLE ID=2 [LIGHT=name]
# AUTO_LIGHT_SCHEDULE_DISABLE ID=2 [LIGHT=name]
