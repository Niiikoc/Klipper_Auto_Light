# Klipper Auto Light - buttons for Mainsail / Fluidd
#
# Add this line to printer.cfg:
#     [include auto_light_macros.cfg]
#
# The buttons show up in the Macros panel. All of them accept an optional
# LIGHT=<name> to control only one [auto_light <name>] group.
# Don't edit this file (it is updated with Auto Light); copy a macro into
# printer.cfg under a different name if you want to change it.

[gcode_macro AUTOLIGHT_PANEL]
description: Auto Light control panel (Mainsail dialog)
gcode:
    AUTO_LIGHT_MENU {('LIGHT=' ~ params.LIGHT) if params.LIGHT else ''}

[gcode_macro AUTOLIGHT_AUTO]
description: End manual values and show the automatic value now
gcode:
    AUTO_LIGHT_RESUME {('LIGHT=' ~ params.LIGHT) if params.LIGHT else ''}

[gcode_macro AUTOLIGHT_ON]
description: Lights on until AUTOLIGHT_AUTO or the next print. VALUE: 1.0, warm@0.5, FF8800, effect:name. DURATION: seconds (optional)
gcode:
    AUTO_LIGHT_SET VALUE={params.VALUE|default("1.0")} {('LIGHT=' ~ params.LIGHT) if params.LIGHT else ''} {('DURATION=' ~ params.DURATION) if params.DURATION else ''}

[gcode_macro AUTOLIGHT_OFF]
description: Lights off until AUTOLIGHT_AUTO or the next print
gcode:
    AUTO_LIGHT_SET VALUE=off {('LIGHT=' ~ params.LIGHT) if params.LIGHT else ''}

[gcode_macro AUTOLIGHT_ENABLE]
description: Turn the Schedule and/or Print switch on. PART: schedule, print or all (default)
gcode:
    AUTO_LIGHT_ENABLE PART={params.PART|default("all")} {('LIGHT=' ~ params.LIGHT) if params.LIGHT else ''}

[gcode_macro AUTOLIGHT_DISABLE]
description: Turn the Schedule and/or Print switch off. PART: schedule, print or all (default)
gcode:
    AUTO_LIGHT_DISABLE PART={params.PART|default("all")} {('LIGHT=' ~ params.LIGHT) if params.LIGHT else ''}
